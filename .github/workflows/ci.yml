name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: umbra
          POSTGRES_PASSWORD: umbra
          POSTGRES_DB: umbra
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U umbra"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Runtime tests (#[sqlx::test]) create their own databases from this URL;
      # the code uses sqlx's runtime query API, so the build itself needs no DB.
      DATABASE_URL: postgres://umbra:umbra@localhost:5432/umbra
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: ci-secret-key-at-least-32-characters-long
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-13
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: backend

      - name: Clippy (advisory)
        working-directory: backend
        run: cargo clippy --all-targets

      - name: Test
        working-directory: backend
        run: cargo test --all-targets

  risk-engine:
    name: Risk Engine (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: risk-engine
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Test
        working-directory: risk-engine
        run: pytest tests/ -v

  bot:
    name: Bot (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: bot
        run: pip install -r requirements.txt

      - name: Compile check
        working-directory: bot
        run: python -m compileall bot

  miniapp:
    name: Mini App (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

  website:
    name: Website (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Install
        working-directory: website
        run: npm install

      - name: Type check
        working-directory: website
        run: npx tsc --noEmit

      - name: Build
        working-directory: website
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, risk-engine, miniapp, website]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build -t umbra-api ./backend

      - name: Build Risk Engine image
        run: docker build -t umbra-risk-engine ./risk-engine

      - name: Build Bot image
        run: docker build -t umbra-bot ./bot

      - name: Build Website image
        run: docker build -t umbra-website ./website
