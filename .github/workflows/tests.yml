name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      # Install everything needed for the test suite (vitest + jsdom + v8 coverage)
      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run coverage

      - name: Print coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e "const c=require('./coverage/coverage-summary.json').total; console.log('Statement coverage: ' + c.statements.pct + '%'); console.log('Branch coverage:    ' + c.branches.pct + '%');"
          else
            echo "No coverage summary found."
          fi
